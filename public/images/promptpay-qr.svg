<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" style="background:#ffffff;border-radius:16px;font-family:sans-serif;">
  <!-- Header Bar -->
  <rect x="0" y="0" width="320" height="70" fill="#003B71" rx="16" />
  <rect x="0" y="50" width="320" height="20" fill="#003B71" />
  <!-- Thai QR Payment / PromptPay Badge -->
  <text x="160" y="32" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">THAI QR PAYMENT</text>
  <text x="160" y="52" fill="#E5CA8A" font-size="11" font-weight="600" text-anchor="middle">PromptPay พร้อมเพย์</text>
  
  <!-- Merchant Card -->
  <rect x="20" y="85" width="280" height="50" fill="#F8F9FA" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <text x="160" y="105" fill="#1A202C" font-size="12" font-weight="bold" text-anchor="middle">Silver Hawk Group Co., Ltd.</text>
  <text x="160" y="122" fill="#718096" font-size="10" text-anchor="middle">Biller ID / Ref: 063-606-4199</text>

  <!-- QR Frame -->
  <rect x="35" y="145" width="250" height="250" fill="#FFFFFF" rx="12" stroke="#CBD5E0" stroke-width="1.5" />
  
  <!-- Corner QR position detection patterns -->
  <!-- Top Left -->
  <rect x="55" y="165" width="46" height="46" fill="#003B71" rx="4"/>
  <rect x="62" y="172" width="32" height="32" fill="#FFFFFF" rx="2"/>
  <rect x="69" y="179" width="18" height="18" fill="#003B71" rx="2"/>
  
  <!-- Top Right -->
  <rect x="219" y="165" width="46" height="46" fill="#003B71" rx="4"/>
  <rect x="226" y="172" width="32" height="32" fill="#FFFFFF" rx="2"/>
  <rect x="233" y="179" width="18" height="18" fill="#003B71" rx="2"/>
  
  <!-- Bottom Left -->
  <rect x="55" y="329" width="46" height="46" fill="#003B71" rx="4"/>
  <rect x="62" y="336" width="32" height="32" fill="#FFFFFF" rx="2"/>
  <rect x="69" y="343" width="18" height="18" fill="#003B71" rx="2"/>
  
  <!-- QR Data pattern elements -->
  <rect x="115" y="165" width="12" height="12" fill="#1A202C" />
  <rect x="135" y="165" width="20" height="12" fill="#1A202C" />
  <rect x="165" y="165" width="12" height="12" fill="#1A202C" />
  <rect x="190" y="165" width="15" height="12" fill="#1A202C" />

  <rect x="115" y="185" width="20" height="12" fill="#1A202C" />
  <rect x="145" y="185" width="12" height="20" fill="#1A202C" />
  <rect x="175" y="185" width="25" height="12" fill="#1A202C" />

  <rect x="115" y="215" width="12" height="20" fill="#1A202C" />
  <rect x="140" y="215" width="25" height="12" fill="#1A202C" />
  <rect x="180" y="215" width="12" height="12" fill="#1A202C" />

  <!-- Center PromptPay Logo Badge in QR -->
  <circle cx="160" cy="270" r="24" fill="#FFFFFF" stroke="#003B71" stroke-width="2"/>
  <rect x="146" y="258" width="28" height="24" fill="#003B71" rx="3"/>
  <path d="M152 264 L160 276 L168 264 Z" fill="#E5CA8A" />

  <!-- Bottom QR Data elements -->
  <rect x="115" y="315" width="20" height="12" fill="#1A202C" />
  <rect x="145" y="315" width="12" height="20" fill="#1A202C" />
  <rect x="170" y="315" width="15" height="12" fill="#1A202C" />
  <rect x="195" y="315" width="20" height="12" fill="#1A202C" />

  <rect x="115" y="345" width="12" height="20" fill="#1A202C" />
  <rect x="140" y="345" width="25" height="12" fill="#1A202C" />
  <rect x="180" y="345" width="15" height="20" fill="#1A202C" />
  <rect x="210" y="345" width="20" height="12" fill="#1A202C" />
  <rect x="240" y="345" width="25" height="12" fill="#1A202C" />

  <text x="160" y="410" fill="#4A5568" font-size="10" font-weight="600" text-anchor="middle">Scan via any Thai Mobile Banking Application</text>
</svg>
